<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Phú Quốc AI – Trợ lý du lịch</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1f2937;
      --border: #30363d;
      --accent: #3ddbd9;
      --accent2: #f97316;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --bot-bubble: #1f2937;
      --user-bubble: #0e4f4f;
      --tag-source: #1a3a3a;
      --tag-reason: #1a2e1a;
      --tag-confidence: #1a1a2e;
      --radius: 18px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .logo-wrap {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #0891b2);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(61,219,217,0.3);
    }

    .header-info h1 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .header-info p {
      font-size: 12px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 7px; height: 7px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    /* CHAT AREA */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* WELCOME */
    .welcome {
      text-align: center;
      padding: 32px 16px 16px;
      animation: fadeUp 0.6s ease both;
    }

    .welcome-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
    }

    .welcome h2 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .welcome p {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 320px;
      margin: 0 auto 20px;
      line-height: 1.6;
    }

    .quick-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 480px;
      margin: 0 auto;
    }

    .quick-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(61,219,217,0.08);
    }

    /* MESSAGES */
    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: fadeUp 0.35s ease both;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }

    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      background: linear-gradient(135deg, var(--accent), #0891b2);
      box-shadow: 0 0 10px rgba(61,219,217,0.2);
    }

    .msg-row.user .avatar {
      background: linear-gradient(135deg, var(--accent2), #dc2626);
      box-shadow: 0 0 10px rgba(249,115,22,0.2);
    }

    .bubble {
      max-width: calc(100% - 80px);
      padding: 13px 16px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-row.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .msg-row.user .bubble {
      background: var(--user-bubble);
      border: 1px solid #0e6b6b;
      border-bottom-right-radius: 4px;
      color: var(--text);
    }

    /* TAG STYLES inside bubble */
    .tag-source {
      display: inline-block;
      margin-top: 10px;
      background: var(--tag-source);
      border: 1px solid #2a5252;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12.5px;
      color: var(--accent);
      width: 100%;
    }

    .tag-reason {
      display: inline-block;
      margin-top: 6px;
      background: var(--tag-reason);
      border: 1px solid #2a4a2a;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12.5px;
      color: #86efac;
      width: 100%;
    }

    .tag-confidence {
      display: inline-block;
      margin-top: 6px;
      background: var(--tag-confidence);
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12.5px;
      color: #a5b4fc;
      width: 100%;
    }

    /* TYPING INDICATOR */
    .typing-row { align-items: center; }

    .typing-bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      padding: 14px 18px;
      display: flex; gap: 5px; align-items: center;
    }

    .dot {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* INPUT AREA */
    .input-area {
      padding: 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .input-wrap {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 12px 10px 16px;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61,219,217,0.1);
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14.5px;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      padding: 2px 0;
    }

    #input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #0891b2);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      color: #0d1117;
    }

    #send-btn:hover { transform: scale(1.05); box-shadow: 0 0 14px rgba(61,219,217,0.4); }
    #send-btn:active { transform: scale(0.96); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #send-btn svg { width: 18px; height: 18px; }

    .char-count {
      font-size: 11px;
      color: var(--text-muted);
      text-align: right;
      max-width: 720px;
      margin: 6px auto 0;
      padding: 0 4px;
    }

    .char-count.warn { color: #f97316; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* SCROLLBAR Firefox */
    #chat { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  </style>
</head>
<body>

<header>
  <div class="logo-wrap">🌴</div>
  <div class="header-info">
    <h1>Phú Quốc AI</h1>
    <p><span class="status-dot"></span> Trợ lý du lịch khu Bắc đảo</p>
  </div>
</header>

<div id="chat">
  <div class="welcome">
    <span class="welcome-icon">🏝️</span>
    <h2>Xin chào! Tôi là trợ lý du lịch Phú Quốc</h2>
    <p>Hỏi tôi bất cứ điều gì về khu Bắc đảo Phú Quốc – chỗ ở, ăn uống, địa điểm tham quan, di chuyển...</p>
    <div class="quick-btns">
      <button class="quick-btn" onclick="sendQuick('Chỗ ở rẻ ở Phú Quốc?')">🏠 Chỗ ở rẻ</button>
      <button class="quick-btn" onclick="sendQuick('Ăn gì ngon ở Phú Quốc?')">🍜 Ăn gì ngon?</button>
      <button class="quick-btn" onclick="sendQuick('Địa điểm tham quan nổi tiếng?')">📍 Địa điểm nổi tiếng</button>
      <button class="quick-btn" onclick="sendQuick('Tôi đi cùng gia đình có trẻ em nhỏ')">👨‍👩‍👧 Đi cùng trẻ em</button>
      <button class="quick-btn" onclick="sendQuick('Di chuyển ở Phú Quốc bằng gì?')">🛵 Di chuyển</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="input" rows="1" placeholder="Hỏi về du lịch Phú Quốc..." maxlength="500"></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Gửi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <div class="char-count" id="char-count">0 / 500</div>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const charCount = document.getElementById('char-count');

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    const len = input.value.length;
    charCount.textContent = `${len} / 500`;
    charCount.classList.toggle('warn', len > 400);
  });

  // Enter to send (Shift+Enter = newline)
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function sendQuick(text) {
    input.value = text;
    sendMessage();
  }

  function formatBotMessage(text) {
    // Replace \n with actual newlines
    text = text.replace(/\\n/g, '\n');

    // Parse and style tags
    const lines = text.split('\n');
    let html = '';
    let mainText = [];

    for (let line of lines) {
      if (line.startsWith('📌')) {
        if (mainText.length) {
          html += `<span>${mainText.join('\n')}</span>`;
          mainText = [];
        }
        html += `<div class="tag-source">${line}</div>`;
      } else if (line.startsWith('💡')) {
        if (mainText.length) {
          html += `<span>${mainText.join('\n')}</span>`;
          mainText = [];
        }
        html += `<div class="tag-reason">${line}</div>`;
      } else if (line.startsWith('🎯')) {
        if (mainText.length) {
          html += `<span>${mainText.join('\n')}</span>`;
          mainText = [];
        }
        html += `<div class="tag-confidence">${line}</div>`;
      } else {
        mainText.push(line);
      }
    }

    if (mainText.length) {
      html += `<span>${mainText.join('\n')}</span>`;
    }

    return html;
  }

  function addMessage(role, text) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'bot' ? '🌴' : '🙋';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (role === 'bot') {
      bubble.innerHTML = formatBotMessage(text);
    } else {
      bubble.textContent = text;
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot typing-row';
    row.id = 'typing';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🌴';

    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    // Remove welcome screen
    const welcome = chat.querySelector('.welcome');
    if (welcome) welcome.remove();

    addMessage('user', text);
    input.value = '';
    input.style.height = 'auto';
    charCount.textContent = '0 / 500';
    charCount.classList.remove('warn');
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch('http://127.0.0.1:8000/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });

      const data = await res.json();
      hideTyping();
      addMessage('bot', data.reply);
    } catch (err) {
      hideTyping();
      addMessage('bot', '⚠️ Không thể kết nối tới server. Vui lòng kiểm tra lại backend đang chạy tại cổng 8000.');
    }

    sendBtn.disabled = false;
    input.focus();
  }
</script>
</body>
</html>
